[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cod-nowcast-ons"
description = "Cloud Optical Depth forecasts using GOES satellite images and a thin wrapper around the pySTEPS module."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "cartopy>=0.25.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.2",
    "opencv-python>=4.11.0.86",
    "plotly>=6.2.0",
    "polars>=1.31.0",
    "pyarrow>=21.0.0",
    "pyjson5>=2.0.0",
    "pysteps>=1.18.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "statsmodels>=0.14.5",
    "xarray>=2025.7.1",
    "boto3>=1.35.0",
    "s3fs>=2024.10.0",
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
include = [
  "app/",
  "main.py"
]

[tool.ruff]
line-length = 80

[project.scripts]
cod-nowcast-ons = "main:main"