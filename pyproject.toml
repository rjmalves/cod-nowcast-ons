[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cod-nowcast-ons"
description = "Cloud Optical Depth forecasts using GOES satellite images and a thin wrapper around the pySTEPS module."
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.25.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.2",
    "opencv-python-headless>=4.11.0.86",
    "plotly>=6.2.0",
    "polars>=1.31.0",
    "pyarrow>=21.0.0",
    "pyjson5>=2.0.0",
    "pysteps>=1.18.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "statsmodels>=0.14.5",
    "xarray>=2025.7.1",
    "boto3>=1.35.0",
    "s3fs>=2024.10.0",
    "nwp-core[cli]>=0.5.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/cod_nowcast_ons"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "moto[s3]>=5.1.17",
    "scipy>=1.16.3",
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250926",
    "boto3-stubs>=1.41.3",
    "ruff>=0.14.6",
    "pyshp>=3.0.2",
    "nwp-core[skill]>=0.5.0",
]

[project.scripts]
cod-nowcast-ons = "cod_nowcast_ons.cli:main"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["cod_nowcast_ons"]

[tool.uv]
required-version = ">=0.9.22"
build-constraint-dependencies = [
    "cython==3.3.1",
    "editables==0.6",
    "hatchling==1.33.0",
    "numpy==2.3.5",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "setuptools==84.2.1",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
    "wheel==0.48.0",
]

[tool.uv.sources]
nwp-core = { git = "https://github.com/rjmalves/nwp-core.git", rev = "956c56b66e2d3d893c5542e9114c07151d062219" }

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cartopy.*", "pysteps.*", "s3fs.*", "scipy.*", "shapefile", "shapefile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=cod_nowcast_ons --cov-report=term-missing"
