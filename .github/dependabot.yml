version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The uv version moves only with a new nwp-core template, together with
      # [tool.uv] required-version. Digest refreshes of the same tag still come.
      - dependency-name: astral-sh/uv
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # A new Python minor or major comes with a new template and test matrix.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
